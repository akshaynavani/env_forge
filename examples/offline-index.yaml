# Offline package index used by the example manifest and the test suite.
# Real deployments point `index:` at "pypi" or an internal PyPI mirror URL.
packages:
  requests:
    "2.32.3":
      requires_python: ">=3.8"
      requires:
        - "charset-normalizer>=2,<4"
        - "idna>=2.5,<4"
        - "urllib3>=1.21.1,<3"
        - "certifi>=2017.4.17"
        - "PySocks>=1.5.6,!=1.5.7; extra == \"socks\""
    "2.31.0":
      requires_python: ">=3.7"
      requires:
        - "charset-normalizer>=2,<4"
        - "idna>=2.5,<4"
        - "urllib3>=1.21.1,<3"
        - "certifi>=2017.4.17"
