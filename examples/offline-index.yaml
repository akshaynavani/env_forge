      requires: ["charset-normalizer>=2,<4", "idna>=2.5,<4", "urllib3>=1.21.1,<1.27", "certifi>=2017.4.17"]
  urllib3:
    "2.2.3": []
    "1.26.20": []
  idna:
    "3.10": []
  certifi:
    "2024.8.30": []
  charset-normalizer:
    "3.4.0": []
  pysocks:
    "1.7.1": []
  pyyaml:
